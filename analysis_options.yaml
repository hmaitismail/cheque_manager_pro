include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter 3.47+ déprécie package:flutter/material.dart au profit de material_ui.
    # Migration prévue en phase 3 ; l'application reste compatible avec les versions antérieures.
    deprecated_member_use: ignore

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: true
