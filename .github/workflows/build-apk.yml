name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet Android
        run: |
          set -o pipefail
          mkdir -p logs
          flutter --version 2>&1 | tee logs/01_version.txt
          flutter create --org ma.chequemanager --project-name cheque_manager_pro --platforms android . 2>&1 | tee logs/02_create.txt
          rm -f test/widget_test.dart
          python3 outils/configurer_plateformes.py 2>&1 | tee logs/03_config.txt
          flutter pub get 2>&1 | tee logs/04_pub_get.txt

      - name: Analyse et tests
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee logs/05_analyze.txt
          flutter test 2>&1 | tee logs/06_test.txt

      - name: Captures d'écran
        continue-on-error: true
        run: |
          flutter test --update-goldens captures/captures_test.dart 2>&1 | tee logs/06b_captures.txt
          mkdir -p logs/captures && cp captures/png/*.png logs/captures/ || true

      - name: Signature définitive
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "ATTENTION : secret SIGNING_PASSWORD absent, APK signé avec une clé temporaire" | tee logs/signature.txt
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signature/release.jks.enc \
            -out android/app/release.jks -pass env:SIGNING_PASSWORD
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=chequemanager\nstoreFile=release.jks\n" \
            "$SIGNING_PASSWORD" "$SIGNING_PASSWORD" > android/key.properties
          echo "Signature définitive activée" | tee logs/signature.txt

      - name: Compiler l'APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=$((100 + ${{ github.run_number }})) 2>&1 | tee logs/07_build.txt
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk 2>&1 | tee -a logs/signature.txt

      - name: Publier l'APK (branche apk)
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk out/CheckManagerPro.apk
          cp -r logs out/
          cp -r logs out_logs_tmp 2>/dev/null || true
          cd out
          git init -q -b apk
          git add .
          git -c user.name="build-bot" -c user.email="build-bot@users.noreply.github.com" commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk

      - name: Publier les journaux en cas d'échec (branche logs)
        if: failure()
        run: |
          mkdir -p logs out_logs
          cp -r logs out_logs/ || true
          cd out_logs
          git init -q -b logs
          git add .
          git -c user.name="build-bot" -c user.email="build-bot@users.noreply.github.com" commit -q -m "Logs build ${{ github.run_number }}" --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheque-manager-pro
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            logs/
