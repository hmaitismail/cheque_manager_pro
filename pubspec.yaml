name: cheque_manager_pro
description: "Cheque Manager Pro - Gestion, suivi et contrôle des chèques émis."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État
  provider: ^6.1.2

  # Base de données locale chiffrée (SQLCipher)
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.5

  # Utilitaires
  uuid: ^4.5.1
  crypto: ^3.0.6
  cryptography: ^2.9.0

  # Notifications locales (fonctionnent application fermée)
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.0

  # Sécurité
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0

  # Pièces jointes
  image_picker: ^1.2.1
  file_picker: ^13.4.0
  open_filex: ^5.0.0

  # Graphiques
  fl_chart: ^1.3.1

  # Exports (PDF, Excel généré en interne, CSV) et sauvegardes
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
